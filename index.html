<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adejo Yunusa — Web Developer & Designer</title>
<meta name="description" content="Adejo Yunusa builds fast, responsive websites with HTML, CSS, JavaScript and React.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js" defer></script>
<script>
/* Start fetching content immediately, in parallel with scripts */
window.__c = fetch('data/content.json',{cache:'no-cache'}).then(r=>r.json());
</script>
<style>
:root{--bg:#ECEEF3;--ink:#0D1B3A;--mute:#4D5873;--navy:#0D1B3A;--y:#FFD60A;--line:#C9CEDB;--r:6px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{background:var(--bg);color:var(--ink);font:400 17px/1.6 'Instrument Sans',system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;line-height:1;letter-spacing:-.03em}
a{color:inherit}img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.w{max-width:1120px;margin:0 auto;padding:0 24px}
section{padding:110px 0}
h2{font-size:clamp(34px,6vw,68px);margin-bottom:48px}
#bar{position:fixed;top:0;left:0;height:4px;width:100%;background:var(--y);transform:scaleX(0);transform-origin:0 50%;z-index:99}
 
header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
.nav{display:flex;justify-content:space-between;align-items:center;height:60px;gap:20px}
.logo{font:800 20px 'Bricolage Grotesque',sans-serif;text-decoration:none;letter-spacing:-.03em}
nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav a{padding:8px 12px;text-decoration:none;font-weight:600;font-size:15px;border-radius:var(--r);white-space:nowrap}
nav a:hover{background:var(--line)}
nav a.on{background:var(--ink);color:#fff}
@media(max-width:560px){.nav{height:auto;flex-direction:column;align-items:flex-start;gap:2px;padding-top:10px}nav{max-width:100%;padding-bottom:8px}}
 
.hero{padding:70px 0 90px}
.hero .w{display:grid;grid-template-columns:1.5fr 1fr;gap:48px;align-items:end}
.hero h1{font-size:clamp(54px,12vw,168px);line-height:.88;margin-bottom:28px}
.ln{display:block;overflow:hidden;padding-bottom:.08em}.ln i{display:block;font-style:normal}
.hero p{max-width:480px;color:var(--mute);font-size:19px;margin-bottom:30px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:14px 26px;font-weight:600;text-decoration:none;border:2px solid var(--ink);border-radius:var(--r);background:none;font:600 16px 'Instrument Sans',sans-serif;cursor:pointer;transition:transform .15s,background .15s}
.btn.f{background:var(--ink);color:#fff}.btn:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--y)}
.pic{position:relative;margin-bottom:10px}
.pic::before{content:"";position:absolute;inset:18px -18px -18px 18px;background:var(--y);border-radius:var(--r)}
.pic img{position:relative;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:var(--r)}
.pic span{position:absolute;z-index:2;left:-10px;bottom:20px;background:var(--ink);color:#fff;padding:8px 14px;font-size:14px;font-weight:600;border-radius:var(--r)}
@media(max-width:820px){.hero .w{grid-template-columns:1fr}.pic{max-width:340px;margin:0 18px 18px 0}}
 
.tick{background:var(--y);overflow:hidden;white-space:nowrap;padding:18px 0;border-block:2px solid var(--ink)}
.tick div{display:inline-flex;gap:44px;animation:t 28s linear infinite;font:800 28px 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em;padding-right:44px}
@keyframes t{to{transform:translateX(-50%)}}
 
.ab{display:grid;grid-template-columns:1.1fr 1fr;gap:64px}
.ab p{margin-bottom:18px;color:var(--mute)}
.ab p:first-child{font-size:22px;color:var(--ink);line-height:1.45}
.tl{border-left:3px solid var(--ink);padding-left:26px;display:grid;gap:26px;align-self:start}
.tl div{position:relative}.tl div::before{content:"";position:absolute;left:-35px;top:7px;width:13px;height:13px;background:var(--y);border:3px solid var(--ink);border-radius:50%}
.tl small{display:block;color:var(--mute);font-size:14px}.tl b{font-size:18px}
@media(max-width:820px){.ab{grid-template-columns:1fr;gap:44px}}
 
.dark{background:var(--navy);color:#fff}
.dark h2{color:var(--y)}
.sv{display:grid;grid-template-columns:repeat(3,1fr);gap:40px}
.sv div{border-top:3px solid var(--y);padding-top:20px}
.sv h3{font-size:28px;margin-bottom:12px}.sv p{color:#B8C2DC}
@media(max-width:820px){.sv{grid-template-columns:1fr;gap:34px}}
 
.stack{display:grid;gap:34px}
.pj{position:sticky;top:calc(80px + var(--i)*14px)}
.card{display:grid;grid-template-columns:1fr 1.2fr;background:#fff;border:2px solid var(--ink);border-radius:10px;overflow:hidden;box-shadow:8px 8px 0 var(--ink);transform-origin:50% 0}
.card .t{padding:34px;display:flex;flex-direction:column;justify-content:space-between;gap:20px}
.card h3{font-size:clamp(26px,3.4vw,40px);margin-bottom:12px}.card p{color:var(--mute)}
.card .im{overflow:hidden;background:var(--line);aspect-ratio:16/10}
.card img{width:100%;height:112%;object-fit:cover}
@media(max-width:820px){.pj{position:static}.card{grid-template-columns:1fr}.card .im{order:-1}.card .t{padding:24px}}
 
.ct{background:var(--y);border-top:2px solid var(--ink)}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:56px}
.ct h2{font-size:clamp(44px,9vw,120px);margin-bottom:34px}
.ct a.l{display:block;font:800 clamp(18px,2.4vw,26px) 'Bricolage Grotesque',sans-serif;padding:14px 0;border-bottom:2px solid var(--ink);text-decoration:none;overflow-wrap:anywhere}
.ct a.l:hover{padding-left:12px;transition:padding .15s}
form{display:grid;gap:14px;align-content:start}
input,textarea{font:inherit;padding:14px;border:2px solid var(--ink);border-radius:var(--r);background:#fff;width:100%}
textarea{min-height:140px;resize:vertical}
form .btn{justify-self:start;min-width:180px}
@media(max-width:820px){.cg{grid-template-columns:1fr;gap:34px}}
footer{padding:22px 0;background:var(--ink);color:#B8C2DC;font-size:14px}
footer .w{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="bar"></div>
<header><div class="w nav">
  <a class="logo" href="#home">Adejo Yunusa</a>
  <nav><a href="#home">Home</a><a href="#about">About</a><a href="#services">Services</a><a href="#work">Work</a><a href="#contact">Contact</a></nav>
</div></header>
 
<main id="app"></main>
 
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 
function render(d){
  const lines=(d.headline||d.name).split('|');
  const skills=(d.skills||[]).map(esc);
  const tick=skills.concat(skills).map(s=>`<span>${s}</span>`).join('');
  document.title=`${d.name} — ${d.role}`;
  document.getElementById('app').innerHTML=`
  <section class="hero" id="home"><div class="w">
    <div>
      <h1>${lines.map(l=>`<span class="ln"><i>${esc(l.trim())}</i></span>`).join('')}</h1>
      <p class="hl">${esc(d.lead)}</p>
      <div class="btns hl"><a class="btn f" href="#work">See my work</a>${d.cv?`<a class="btn" href="${esc(d.cv)}" download>Download CV</a>`:''}</div>
    </div>
    <div class="pic hl"><img src="${esc(d.photo)}" alt="${esc(d.name)}" fetchpriority="high">${d.available?`<span>${esc(d.available)}</span>`:''}</div>
  </div></section>
  <div class="tick" aria-hidden="true"><div>${tick}</div></div>
  <section id="about"><div class="w">
    <h2 class="rv">About</h2>
    <div class="ab"><div class="rv">${(d.about||[]).map(p=>`<p>${esc(p)}</p>`).join('')}</div>
    <div class="tl">${(d.timeline||[]).map(t=>`<div class="rv"><b>${esc(t.title)}</b><small>${esc(t.meta)}</small></div>`).join('')}</div></div>
  </div></section>
  <section class="dark" id="services"><div class="w">
    <h2 class="rv">What I do</h2>
    <div class="sv">${(d.services||[]).map(s=>`<div class="rv"><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p></div>`).join('')}</div>
  </div></section>
  <section id="work"><div class="w">
    <h2 class="rv">Selected work</h2>
    <div class="stack">${(d.projects||[]).map((p,i)=>`<div class="pj" style="--i:${i}"><article class="card">
      <div class="t"><div><h3>${esc(p.title)}</h3><p>${esc(p.desc)}</p></div><div><a class="btn" href="${esc(p.url)}" target="_blank" rel="noopener">Visit site</a></div></div>
      <div class="im"><img src="${esc(p.img)}" alt="${esc(p.title)}" loading="lazy" decoding="async"></div>
    </article></div>`).join('')}</div>
  </div></section>
  <section class="ct" id="contact"><div class="w">
    <h2 class="rv">Let's build something.</h2>
    <div class="cg">
      <div class="rv"><a class="l" href="mailto:${esc(d.email)}">${esc(d.email)}</a><a class="l" href="https://wa.me/${esc(d.phone.replace(/\D/g,''))}">${esc(d.phone)}</a>${d.cv?`<a class="l" href="${esc(d.cv)}" download>Download my CV</a>`:''}</div>
      <form id="cf" class="rv">
        <input id="n" placeholder="Your name" aria-label="Your name" required>
        <input id="e" type="email" placeholder="Your email" aria-label="Your email" required>
        <textarea id="m" placeholder="Tell me about your project" aria-label="Message" required></textarea>
        <button class="btn f" id="sb">Send message</button>
      </form>
    </div>
  </div></section>
  <footer><div class="w"><span>© ${new Date().getFullYear()} ${esc(d.name)}</span><span>${esc(d.footer||'')}</span></div></footer>`;
}
 
function motion(){
  const g=window.gsap,reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(!g||!window.ScrollTrigger||reduce)return;
  g.registerPlugin(ScrollTrigger);
  // 1. The one page-load moment: headline lines slide up out of a mask
  g.from('.ln i',{yPercent:110,duration:.9,stagger:.12,ease:'power4.out'});
  g.from('.hl',{y:30,opacity:0,duration:.8,delay:.45,stagger:.1,ease:'power2.out'});
  // 2. Progress bar tied to scroll
  g.to('#bar',{scaleX:1,ease:'none',scrollTrigger:{scrub:.2,start:0,end:'max'}});
  // 3. Section content reveals
  g.utils.toArray('.rv').forEach(el=>g.from(el,{y:36,opacity:0,duration:.7,ease:'power2.out',scrollTrigger:{trigger:el,start:'top 90%',once:true}}));
  // 4. Skills ticker speeds up with scroll velocity
  const tk=document.querySelector('.tick div');
  ScrollTrigger.create({onUpdate:s=>{const v=Math.min(Math.abs(s.getVelocity())/400,6);tk.style.animationDuration=(28/(1+v))+'s'}});
  // 5. Project cards: stack on scroll, earlier cards recede, images drift
  const mm=g.matchMedia();
  mm.add('(min-width:821px)',()=>{
    const cards=g.utils.toArray('.pj');
    cards.forEach((c,i)=>{
      const n=cards[i+1];
      if(n)g.to(c.firstElementChild,{scale:.93,opacity:.55,ease:'none',scrollTrigger:{trigger:n,start:'top 85%',end:'top 25%',scrub:true}});
      g.fromTo(c.querySelector('img'),{yPercent:-8},{yPercent:0,ease:'none',scrollTrigger:{trigger:c,start:'top bottom',end:'bottom top',scrub:true}});
    });
  });
}
 
function nav(){
  const links=[...document.querySelectorAll('nav a')];
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)links.forEach(l=>l.classList.toggle('on',l.hash==='#'+e.target.id))}),{rootMargin:'-45% 0px -50% 0px'});
  document.querySelectorAll('main section').forEach(s=>io.observe(s));
}
 
function form(){
  const f=document.getElementById('cf'),b=document.getElementById('sb');
  if(!f)return;
  f.addEventListener('submit',e=>{
    e.preventDefault();
    if(!window.emailjs){alert('The form is still loading. Try again in a moment, or email me directly.');return}
    emailjs.init('N_Ysu-09rQIDKxYmH');
    b.disabled=true;b.textContent='Sending…';
    emailjs.send('service_hpvnn45','template_y9zbrlq',{from_name:n.value,reply_to:e.target.e.value,message:m.value})
      .then(()=>{b.textContent='Message sent';f.reset();setTimeout(()=>{b.textContent='Send message';b.disabled=false},3000)})
      .catch(()=>{b.textContent='Send message';b.disabled=false;alert('Message could not be sent. Please try again or email me directly.')});
  });
}
 
window.__c.then(d=>{
  const go=()=>{render(d);nav();form();motion()};
  document.readyState==='loading'?addEventListener('DOMContentLoaded',go):go();
}).catch(()=>{document.getElementById('app').innerHTML='<section><div class="w"><h2>Content could not load.</h2><p>If you opened this file directly, run it from a local server or GitHub Pages so data/content.json can be read.</p></div></section>'});
</script>
</body>
</html>
