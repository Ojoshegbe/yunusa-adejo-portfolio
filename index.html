<main id="app"></main>
 
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICONS={html:'fa-solid fa-code',css:'fa-brands fa-css',javascript:'fa-brands fa-square-js',react:'fa-brands fa-react',git:'fa-brands fa-git-alt',github:'fa-brands fa-github','node.js':'fa-brands fa-node',npm:'fa-brands fa-npm',sass:'fa-brands fa-sass',vue:'fa-brands fa-vuejs',angular:'fa-brands fa-angular'};
const TICKER=['fa-solid fa-code','fa-brands fa-sass','fa-brands fa-css','fa-brands fa-react','fa-brands fa-square-js','fa-brands fa-node','fa-brands fa-vuejs','fa-brands fa-npm','fa-brands fa-angular','fa-brands fa-git-alt','fa-brands fa-github','fa-solid fa-code-compare','fa-brands fa-git','fa-brands fa-visual-studio','fa-brands fa-dev','fa-solid fa-reply'];
 
function render(d){
  const head=esc(d.headline||d.name).replace(/\*(.+?)\*/g,'<em>$1</em>');
  const n=TICKER.length;
  document.title=`${d.name} — ${d.role}`;
  document.getElementById('app').innerHTML=`
  <section class="hero" id="home"><div class="glow"></div>
    <div class="wrap hero-grid">
      <div>
        <span class="eyebrow">${esc(d.role)}</span>
        <h1>${head}</h1>
        <p class="lead">${esc(d.lead)}</p>
        <div class="btn-row"><a href="#portfolio" class="btn btn-primary">View my work</a>${d.cv?`<a href="${esc(d.cv)}" class="btn btn-ghost" download>Download CV</a>`:''}</div>
      </div>
      <div class="portrait"><img src="${esc(d.photo)}" alt="${esc(d.name)}" fetchpriority="high">${d.available?`<div class="tag"><span class="dot"></span> ${esc(d.available)}</div>`:''}</div>
    </div>
  </section>
  <section class="scroll" aria-hidden="true"><div class="scroll-cont">${TICKER.map((c,i)=>`<i class="${c}" style="animation-delay:calc(25s / ${n} * ${n-i-1} * -1)"></i>`).join('')}</div></section>
  <section id="about"><div class="wrap">
    <div class="section-head"><span class="eyebrow">About</span><h2>A bit about how I work</h2></div>
    <div class="about-grid">
      <div>${(d.about||[]).map(p=>`<p>${esc(p)}</p>`).join('')}
        <div class="skill-grid">${(d.skills||[]).map(s=>`<div class="skill-chip">${ICONS[s.toLowerCase()]?`<i class="${ICONS[s.toLowerCase()]}"></i>`:''}${esc(s)}</div>`).join('')}</div>
      </div>
      <div>${(d.timeline||[]).map(t=>`<div class="info-row"><div class="k">${esc(t.label||'')}</div><div class="v"><div class="role">${esc(t.title)}</div><div class="meta">${esc(t.meta)}</div></div></div>`).join('')}</div>
    </div>
  </div></section>
  <section class="alt" id="services"><div class="wrap">
    <div class="section-head"><span class="eyebrow">Services</span><h2>What I can help with</h2></div>
    <div class="service-grid">${(d.services||[]).map((s,i)=>`<div class="service-card"><span class="num">${String(i+1).padStart(2,'0')}</span><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p></div>`).join('')}</div>
  </div></section>
  <section id="portfolio"><div class="wrap">
    <div class="section-head"><span class="eyebrow">Portfolio</span><h2>Selected work</h2></div>
    <div class="project-list">${(d.projects||[]).map(p=>`<div class="project"><img src="${esc(p.img)}" alt="${esc(p.title)}" loading="lazy" decoding="async"><div><h3>${esc(p.title)}</h3><p>${esc(p.desc)}</p></div><a class="visit" href="${esc(p.url)}" target="_blank" rel="noopener">Visit site →</a></div>`).join('')}</div>
  </div></section>
  <section class="alt" id="contact"><div class="wrap">
    <div class="section-head"><span class="eyebrow">Contact</span><h2>Let's work together</h2><p>Have a project in mind, or just want to say hi? Reach out below — messages go straight to my inbox.</p></div>
    <div class="contact-grid">
      <div class="contact-card">
        <div class="contact-line"><span class="k">EMAIL</span> <a href="mailto:${esc(d.email)}">${esc(d.email)}</a></div>
        <div class="contact-line"><span class="k">PHONE</span> <a href="https://wa.me/${esc(String(d.phone).replace(/\D/g,''))}">${esc(d.phone)}</a></div>
        ${d.cv?`<div class="contact-line"><span class="k">RESUME</span> <a href="${esc(d.cv)}" download>Download CV</a></div>`:''}
      </div>
      <form id="contact-form">
        <input type="text" id="from_name" placeholder="Your name" aria-label="Your name" required>
        <input type="email" id="reply_to" placeholder="Your email" aria-label="Your email" required>
        <textarea id="message" placeholder="Tell me about your project" aria-label="Message" required></textarea>
        <button type="submit" class="submit" id="submit-btn">Send message</button>
      </form>
    </div>
  </div></section>
  <footer><div class="wrap"><p>© ${new Date().getFullYear()} ${esc(d.name)}</p><p>${esc(d.footer||'')}</p></div></footer>`;
}
 
/* theme (synced desktop + mobile) */
function theme(){
  const root=document.documentElement,btns=['theme-toggle','theme-toggle-mobile'].map(i=>document.getElementById(i));
  const icons=()=>btns.forEach(b=>b.textContent=root.dataset.theme==='dark'?'☀️':'🌙');
  icons();
  btns.forEach(b=>b.onclick=()=>{
    const dark=root.dataset.theme==='dark';
    dark?root.removeAttribute('data-theme'):root.setAttribute('data-theme','dark');
    try{localStorage.setItem('theme',dark?'light':'dark')}catch(e){}
    icons();
  });
}
 
function dock(){
  const links=[...document.querySelectorAll('header nav a[href^="#"],.mobile-dock a[href^="#"]')];
  const set=id=>links.forEach(l=>l.classList.toggle('active',l.getAttribute('href')===id));
  let lock=0;
  // highlights whichever section crosses the middle of the screen (works for tall sections too)
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&Date.now()>lock)set('#'+e.target.id)}),{rootMargin:'-45% 0px -50% 0px'});
  document.querySelectorAll('main section[id]').forEach(s=>io.observe(s));
  // glow on every touch
  const glow=el=>{el.classList.remove('glow-tap');void el.offsetWidth;el.classList.add('glow-tap');if(navigator.vibrate)navigator.vibrate(8)};
  document.querySelectorAll('.mobile-dock a,.mobile-dock button').forEach(el=>{
    el.addEventListener('pointerdown',()=>glow(el));
    el.addEventListener('animationend',()=>el.classList.remove('glow-tap'));
  });
  // tap = instant highlight + smooth scroll
  document.querySelectorAll('.mobile-dock a[href^="#"]').forEach(a=>a.addEventListener('click',e=>{
    const id=a.getAttribute('href'),t=document.querySelector(id);
    if(!t)return;
    e.preventDefault();
    set(id);lock=Date.now()+1200;
    t.scrollIntoView({behavior:'smooth',block:'start'});
    history.replaceState(null,'',id);
  }));
}
 
/* scroll-triggered animation (GSAP ScrollTrigger). Content stays visible if it fails to load. */
function motion(){
  const g=window.gsap;
  if(!g||!window.ScrollTrigger||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  g.registerPlugin(ScrollTrigger);
  addEventListener('load',()=>ScrollTrigger.refresh());
  // page-load sequence
  g.from('.hero .eyebrow,.hero h1,.hero .lead,.hero .btn-row',{y:30,opacity:0,duration:.8,stagger:.12,ease:'power3.out',delay:.15});
  g.from('.portrait',{clipPath:'inset(0 0 100% 0)',duration:1,ease:'power3.out',delay:.2});
  // scroll progress
  g.to('#bar',{scaleX:1,ease:'none',scrollTrigger:{scrub:.2,start:0,end:'max'}});
  // section headings
  g.utils.toArray('.section-head').forEach(el=>g.from(el,{y:34,opacity:0,duration:.7,ease:'power2.out',scrollTrigger:{trigger:el,start:'top 88%',once:true}}));
  // grouped items rise in as each group enters
  const rise='.about-grid>div:first-child>p,.skill-chip,.info-row,.service-card,.contact-card,#contact-form';
  g.set(rise,{y:30,opacity:0});
  ScrollTrigger.batch(rise,{start:'top 90%',once:true,onEnter:b=>g.to(b,{y:0,opacity:1,duration:.6,stagger:.08,ease:'power2.out',clearProps:'transform,opacity'})});
  // project rows: image wipes in and drifts, text slides
  g.utils.toArray('.project').forEach(row=>{
    const img=row.querySelector('img');
    g.fromTo(img,{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0% 0 0)',ease:'none',scrollTrigger:{trigger:row,start:'top 92%',end:'top 55%',scrub:true},onComplete(){img.style.clipPath='none'}});
    g.from(row.children[1],{x:-30,opacity:0,duration:.7,ease:'power2.out',scrollTrigger:{trigger:row,start:'top 85%',once:true}});
  });
}
 
function form(){
  const f=document.getElementById('contact-form'),b=document.getElementById('submit-btn');
  f.addEventListener('submit',e=>{
    e.preventDefault();
    if(!window.emailjs){alert('The form is still loading. Try again in a moment, or email me directly.');return}
    emailjs.init('N_Ysu-09rQIDKxYmH');
    b.disabled=true;b.textContent='Sending…';
    emailjs.send('service_hpvnn45','template_y9zbrlq',{from_name:document.getElementById('from_name').value,reply_to:document.getElementById('reply_to').value,message:document.getElementById('message').value})
      .then(()=>{b.classList.add('sent');b.textContent='✓ Message sent';f.reset();setTimeout(()=>{b.classList.remove('sent');b.textContent='Send message';b.disabled=false},3000)})
      .catch(err=>{b.textContent='Send message';b.disabled=false;alert('Message could not be sent. Please try again or email me directly.');console.error(err)});
  });
}
 
const pre=()=>document.getElementById('preloader').classList.add('hide');
window.__c.then(d=>{
  const go=()=>{render(d);theme();dock();form();pre();motion()};
  document.readyState==='loading'?addEventListener('DOMContentLoaded',go):go();
}).catch(err=>{
  document.getElementById('app').innerHTML='<section><div class="wrap"><h2>Content could not load.</h2><p>Reason: '+esc(err.message)+'</p></div></section>';
  pre();console.error(err);
});
setTimeout(pre,4000);
</script>
